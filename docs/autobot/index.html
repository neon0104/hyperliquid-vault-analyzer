<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0f19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="자동운용봇">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="../app-icon.svg">
<link rel="apple-touch-icon" href="../app-icon.svg">
<title>자동운용 관제센터 · Hyperliquid</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
    background: #0b0f19; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app-frame { border: 0; width: 100%; height: 100dvh; display: none; background: #0b0f19; }
  #gw-overlay {
    width: 100%; height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: #0b0f19;
  }
  .box {
    max-width: 370px; width: calc(100% - 36px); background: #131b2e;
    border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 18px;
    padding: 28px 22px; text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }
  .spin {
    width: 34px; height: 34px; border: 3px solid rgba(56, 189, 248, 0.2);
    border-top-color: #38bdf8; border-radius: 50%; margin: 0 auto 16px;
    animation: sp 0.8s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  h2 { margin: 0 0 8px; font-size: 1.08rem; color: #f8fafc; }
  p { margin: 0; font-size: 0.84rem; color: #94a3b8; line-height: 1.5; }
  form { display: none; margin-top: 16px; text-align: left; }
  label { display: block; font-size: 0.78rem; color: #94a3b8; margin: 0 0 5px; }
  input {
    width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 9px;
    border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.92rem; margin-bottom: 12px;
  }
  button {
    width: 100%; padding: 11px; border-radius: 9px; border: none;
    background: #2563eb; color: #fff; font-weight: 700; font-size: 0.92rem; cursor: pointer;
  }
  #gw-retry-btn { display: none; margin-top: 16px; }
</style>
<script>window.__GW_DEFAULT_ROUTE = "/autobot";</script>
<script src="../gateway-shell.js" defer></script>
</head>
<body>
<iframe id="app-frame" title="Hyperliquid Autobot Control"></iframe>
<div id="gw-overlay">
  <div class="box">
    <div class="spin" id="gw-spin"></div>
    <h2 id="gw-title">🔒 고정 보안 터널 연결 중...</h2>
    <p id="gw-msg">실시간 온체인 서버와 동기화하고 있습니다.</p>
    <form id="gw-key-form" onsubmit="window.__submitGatewayKey(event)">
      <label>전용 보안키 (최초 1회)</label>
      <input type="password" id="gw-key-input" placeholder="보안키 입력" required>
      <button type="submit">저장 후 바로 열기</button>
    </form>
    <form id="gw-login-form" onsubmit="window.__submitGatewayLogin(event)">
      <label>관리자 이메일</label>
      <input type="email" id="gw-email" value="admin@hyperliquid.com" required autocomplete="username">
      <label>비밀번호</label>
      <input type="password" id="gw-pw" placeholder="비밀번호 입력" required autocomplete="current-password">
      <button type="submit" id="gw-login-btn">로그인 (180일 자동유지)</button>
    </form>
    <button id="gw-retry-btn" onclick="window.__retryGateway()">🔄 다시 연결</button>
  </div>
</div>
</body>
</html>
